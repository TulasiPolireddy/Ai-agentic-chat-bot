<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Agent Chat</h1>
      <div class="key-box">
        <input id="api-key" type="password" placeholder="Anthropic API key" autocomplete="off">
        <button id="save-key" type="button">Save key</button>
      </div>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div class="msg bot">
        Hi, I can answer questions and use tools: a calculator, the current time,
        and a notepad. Try: "What is 18% of 2450, and save the result as a note."
      </div>
    </section>

    <form id="chat-form" class="composer">
      <input id="user-input" type="text" placeholder="Ask or give a task..." autocomplete="off" required>
      <button id="send-btn" type="submit">Send</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
