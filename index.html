
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Agent AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">
        <h2>✦ Nova Agent</h2>

        <button onclick="newChat()">+ New Chat</button>

        <h4>YOUR ASSISTANT</h4>
        <p class="menu active">💬 AI Chat</p>
        <p class="menu">🤖 Agent Mode</p>
        <p class="menu">📋 Task Assistant</p>

        <div class="bottom">
            <p>Basic Agentic AI Project</p>
            <small>Plan • Act • Observe</small>
        </div>
    </aside>

    <main class="main">

        <header>
            <h3>AI Agent Assistant</h3>
            <span>● Ready</span>
        </header>

        <section class="chat-area" id="chatArea">

            <div class="welcome" id="welcome">
                <div class="symbol">✦</div>
                <h1>What can I do for you?</h1>
                <p>Give me a goal. I'll plan and work on it.</p>

                <div class="examples">
                    <button onclick="useExample('Calculate 250 + 350')">
                        🧮 Calculate 250 + 350
                    </button>

                    <button onclick="useExample('Create a task to learn HTML')">
                        📋 Create a task
                    </button>

                    <button onclick="useExample('Make a plan to learn JavaScript')">
                        🎯 Make a learning plan
                    </button>

                    <button onclick="useExample('What is today’s date?')">
                        📅 Get today's date
                    </button>
                </div>
            </div>

            <div id="messages"></div>

        </section>

        <div class="input-area">
            <div class="input-box">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Tell your AI agent what to do..."
                    onkeydown="if(event.key === 'Enter') runAgent()"
                >
                <button onclick="runAgent()">➤</button>
            </div>
            <p>Nova Agent can plan tasks and use basic built-in tools.</p>
        </div>

    </main>

</div>

<script src="script.js"></script>
</body>
</html>
