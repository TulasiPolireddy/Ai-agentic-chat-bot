
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <h2>✦ NOVA</h2>
        <button onclick="newChat()">+ New Chat</button>
        <p class="menu-title">WORKSPACE</p>
        <button class="menu active">✦ AI Assistant</button>
        <button class="menu" onclick="showTasks()">☷ My Tasks</button>
        <div class="status">🟢 Agent Active</div>
    </aside>

    <main class="main">
        <header>
            <span>✦ Your Personal AI Agent</span>
            <button onclick="newChat()">Clear Chat</button>
        </header>

        <section class="chat-area" id="chatArea">
            <div class="welcome" id="welcome">
                <h1>What can I help<br><span>you get done?</span></h1>
                <p>I can understand your goals, create plans, perform tasks and remember information.</p>

                <div class="suggestions">
                    <button onclick="quickAsk('Plan my day with study and breaks')">📅 Plan my day</button>
                    <button onclick="quickAsk('Calculate 18% of 2450')">🧮 Calculate something</button>
                    <button onclick="quickAsk('Remember that my project deadline is Friday')">🧠 Remember something</button>
                    <button onclick="quickAsk('Create a checklist for building a portfolio website')">☷ Create a checklist</button>
                </div>
            </div>
            <div id="messages"></div>
        </section>

        <div class="input-area">
            <textarea id="userInput" placeholder="Tell Nova what you want to accomplish..."></textarea>
            <button onclick="sendMessage()">➤</button>
        </div>
        <p class="footer">Powered by Nova Agent System</p>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
